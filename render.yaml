# Render Blueprint — deploy from Dashboard: New → Blueprint → connect Verba-Limited/xaccess-api
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: xaccess-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/public/communities
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Port 7788 is not exposed on Render; HTTP validate API still works.
      - key: DISABLE_DEVICE_WS
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: xaccess-db
          property: connectionString

databases:
  - name: xaccess-db
    plan: free
    databaseName: xaccess
    user: xaccess
